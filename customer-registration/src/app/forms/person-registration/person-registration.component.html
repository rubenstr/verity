<app-header [title]="titlename"></app-header>
{{state()}}
<div class="card">
  <div class="card-body">
<form class="row g-3">
  <div class="col-md-12 mb-3">
    <label for="nome" class="form-label">Nome Completo:</label>
    <input type="text" class="form-control" id="nome" aria-describedby="nameHelp" [value]="state()" (control)="saveDataForm($event)" required>
    <div id="nameHelp" class="form-text">Por favor insira seu nome completo.</div>
  </div>
  <div class="col-md-4">
    <label for="dataNascimento" class="form-label">Data de Nascimento:</label>
    <input type="date" class="form-control" id="dataNascimento" [value]="state()" (input)="saveDataForm($event)" required>
    <div class="invalid-feedback">Por favor preencher o campo obrigatório.</div>
  </div>
  <div class="col-md-4">
    <label for="cpf" class="form-label">CPF:</label>
    <input class="form-control" id="cpf" mask="000.000.000-00" [value]="state()" (input)="saveDataForm($event)" required>
    <div class="invalid-feedback">Por favor preencher o campo obrigatório.</div>
  </div>
    <div class="col-md-4">
    <label for="tefelone" class="form-label">Tefelone:</label>
    <input type="tel" class="form-control" id="tefelone" mask="(00) 0 0000-0000" required>
    <div class="invalid-feedback">Por favor preencher o campo obrigatório.</div>
  </div>

  <button type="submit" class="btn btn-primary button-enviar" routerLink="residencial">Avançar</button> 
</form>

  </div>
</div>
